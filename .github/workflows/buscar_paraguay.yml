name: Buscar nuevos canales Paraguay
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - run: python3 Actualizar_Individual.py buscar
      - uses: actions/upload-artifact@v4
        with:
          name: Candidatos-IPTV
          path: Candidatos_Individuales.csv
